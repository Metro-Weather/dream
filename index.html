<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080b">
<title>Dream.</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:#08080b;color:#eee;font:16px -apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 14px 48px}
h1{font-size:40px;margin:6px 0 14px;letter-spacing:-1.5px;font-weight:800}
button,.btn{appearance:none;-webkit-appearance:none;border:0;border-radius:14px;padding:12px 16px;background:#1d1d24;color:#eee;font:600 16px -apple-system,system-ui,sans-serif;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-visible{outline:2px solid #9db8ff;outline-offset:2px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
#pick{display:block;text-align:center;width:100%}
#ed{width:100%;touch-action:none;border-radius:14px;background:#000;display:block;margin:10px 0}
#cmd{width:100%;padding:14px;border-radius:14px;border:1px solid #2c2c36;background:#121218;color:#fff;font-size:17px}
#go{width:100%;margin-top:10px;background:#fff;color:#000;font-size:20px;padding:16px;font-weight:800}
#go:disabled{opacity:.45}
#got{min-height:20px;color:#a9a9ff;font-size:14px;margin-top:8px;line-height:1.35}
#status{min-height:20px;color:#9a9aa6;font-size:14px;margin-top:4px}
#out{width:100%;border-radius:14px;background:#000;display:block;margin-top:12px}
#vid{width:100%;border-radius:14px;display:none;margin-top:12px;background:#000}
#save{width:100%;margin-top:10px}

small{color:#6f6f7a;display:block;margin-top:12px;line-height:1.4;font-size:13px}
</style></head>
<body><main>
<h1>Dream.</h1>
<label class="btn" id="pick" for="f1" tabindex="0">choose photo</label><input id="f1" type="file" accept="image/*">
<canvas id="ed" width="600" height="600" aria-label="the part of your photo that will move"></canvas>
<input id="cmd" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="type anything: explode in space" aria-label="what should happen">
<div id="got"></div>
<button id="go">Dream</button>
<div id="status"></div>
<canvas id="out" width="1080" height="1080"></canvas>
<video id="vid" playsinline loop muted controls></video>
<button id="save" disabled>Save</button><a id="dl" download="dream.mp4" style="display:none">save</a>
<small>pick any photo of anything. it cuts out the main thing (person, pet, car, whatever) right on your phone and does what you type to it. first photo downloads a ~44 MB cut-out AI once. your photo never leaves your phone.</small>
</main>

async function cutoutScene(img){

/* ---------------- video ---------------- */
